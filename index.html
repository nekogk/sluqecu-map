<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sluqecu Metropolis Map</title>
        <link rel="icon" href="icon.svg" type="image/x-icon">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="custom-controls">
            <button id="lang-toggle" class="control-btn" onclick="toggleLang(this)" aria-label="Toggle language">
                <img src="icons/language.svg" class="btn-icon" alt="">
            </button>
            <button id="transit-toggle" class="control-btn" onclick="toggleTransit(this)" aria-label="Toggle transit layer">
                <img src="icons/directions.svg" class="btn-icon" alt="">
            </button>
        </div>
        <div id="map"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="script.js"></script>
    </body>
</html>
